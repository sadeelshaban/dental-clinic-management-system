services:
  mariadb:
    image: mariadb:10.4
    container_name: dental-clinic-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: dental_clinic_db
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/dental_clinic_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api:
    build:
      context: ./backend/DentalClinic.API
      dockerfile: Dockerfile
    container_name: dental-clinic-api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      UseHttpsRedirection: "false"
      ConnectionStrings__DentalClinicDb: >-
        Server=mariadb;Port=3306;Database=dental_clinic_db;User=root;Password=${MARIADB_ROOT_PASSWORD};TreatTinyAsBoolean=true;
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 characters)}
      Jwt__Issuer: DentalClinic.API
      Jwt__Audience: DentalClinic.Client
      Jwt__ExpirationMinutes: "480"
      Uploads__Path: uploads
    ports:
      - "${API_PORT:-5062}:8080"
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: dental-clinic-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"


volumes:
  mariadb_data:
  api_uploads:
